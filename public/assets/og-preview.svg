<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e244d" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#070a12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#07090e"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Badge: Supercomputing Affiliation -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="460" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="19" r="5" fill="#10b981"/>
    <circle cx="20" cy="19" r="9" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="36" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">SPIKE-A SUPERCOMPUTER // TU EINDHOVEN (AI-SIB)</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="200" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Siddharth <tspan fill="url(#textGrad)">Ganjoo</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="250" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
    Machine Learning Engineer &amp; Data Scientist
  </text>

  <!-- Core Focus Paragraph -->
  <text x="80" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="400" line-height="28">
    Scaling high-performance AI infrastructure, Spiking Neural Networks (SNNs), and distributed deep learning.
  </text>
  <text x="80" y="333" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="400">
    MSc Computer Science @ TU/e • Ex-CTO Loopit.ai • EAISI Award Winner
  </text>

  <!-- Impact Stats Bento Cards -->
  <g transform="translate(80, 390)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="220" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="24" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">€25K+</text>
    <text x="24" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Annual Savings</text>

    <!-- Stat 2 -->
    <rect x="240" y="0" width="220" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="264" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">50%</text>
    <text x="264" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Error Reduction</text>

    <!-- Stat 3 -->
    <rect x="480" y="0" width="220" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="504" y="44" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">€1,000</text>
    <text x="504" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">EAISI AI Award</text>

    <!-- Stat 4 -->
    <rect x="720" y="0" width="220" height="96" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="744" y="44" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800">1.8 pJ</text>
    <text x="744" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">SNN Energy/Spike</text>
  </g>

  <!-- Right Neural Graphic / SNN Visual Cue -->
  <g transform="translate(1000, 220)" stroke="#38bdf8" stroke-width="1.5" opacity="0.65">
    <line x1="-120" y1="-80" x2="-20" y2="-40" stroke-opacity="0.3"/>
    <line x1="-120" y1="0" x2="-20" y2="-40" stroke-opacity="0.5"/>
    <line x1="-120" y1="80" x2="-20" y2="40" stroke-opacity="0.3"/>
    <line x1="-20" y1="-40" x2="60" y2="0" stroke-opacity="0.6"/>
    <line x1="-20" y1="40" x2="60" y2="0" stroke-opacity="0.6"/>

    <circle cx="-120" cy="-80" r="8" fill="#38bdf8"/>
    <circle cx="-120" cy="0" r="8" fill="#38bdf8"/>
    <circle cx="-120" cy="80" r="8" fill="#38bdf8"/>
    <circle cx="-20" cy="-40" r="10" fill="#818cf8"/>
    <circle cx="-20" cy="40" r="10" fill="#818cf8"/>
    <circle cx="60" cy="0" r="12" fill="#34d399"/>
  </g>

  <!-- Footer Domain / URL Tag -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500">
      https://siddharthganjoo.github.io • Eindhoven, Netherlands
    </text>
  </g>
</svg>
